<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="erpGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Modern rounded squircle background badge -->
  <rect width="64" height="64" rx="16" fill="url(#erpGradient)" />
  
  <!-- Subtle inner border for contrast -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Main Sparkle Star (Matching ERP Sidebar Branding) -->
  <path d="M 32 10 Q 32 32 54 32 Q 32 32 32 54 Q 32 32 10 32 Q 32 32 32 10 Z" fill="#ffffff" filter="url(#glow)" />

  <!-- Top-left Accent Sparkle -->
  <path d="M 16 11 Q 16 16 21 16 Q 16 16 16 21 Q 16 16 11 16 Q 16 16 16 11 Z" fill="#ffffff" opacity="0.92" />

  <!-- Bottom-right Accent Sparkle -->
  <path d="M 48 43 Q 48 48 53 48 Q 48 48 48 53 Q 48 48 43 48 Q 48 48 48 43 Z" fill="#ffffff" opacity="0.92" />
</svg>
